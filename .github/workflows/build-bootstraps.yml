name: Build bootstraps

on:
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        description: "Release built bootstraps"
      tag:
        type: string
        description: "Tag for the release"

jobs:
  bootstraps:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target_arch: [aarch64, arm, i686, x86_64]

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h

      - name: Clone repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Get packages from termux-packages
        uses: actions/checkout@v7
        with:
          path: termux-packages
          repository: termux/termux-packages
          ref: "23d530425344010b73b0392ab66b041e8f65e34b"

      - name: Setup environment
        run: |
          cp build-bootstraps.sh termux-packages/scripts/
          patch -d termux-packages -p1 < patches/properties.patch
          for package in patches/*/; do
            cp -r "$package" termux-packages/packages/
          done
          if [ -d termux-packages/packages/gems ]; then
            rm -rf termux-packages/packages/ruby/gem-patches
            mv termux-packages/packages/gems termux-packages/packages/ruby/gem-patches
          fi
          find termux-packages/packages/git -type f -name "*subpackage*" -exec rm {} +
          find termux-packages/packages/libxml2 -type f -name "*python*" -exec rm {} +

      - name: Create bootstrap archive
        working-directory: termux-packages
        env:
          CI: "true"
        run: |
          ./scripts/run-docker.sh true
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh \
            --android10 -f --architectures ${{ matrix.target_arch }}

      - name: Store bootstrap
        uses: actions/upload-artifact@v7
        with:
          name: ruby-${{ matrix.target_arch }}
          path: termux-packages/output/ruby-${{ matrix.target_arch }}.zip
          if-no-files-found: error

  release:
    needs: bootstraps
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event.inputs.release == 'true' && startsWith(github.event.inputs.tag, 'v')
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch bootstrap archives
        uses: actions/download-artifact@v8
        with:
          path: ./
          merge-multiple: true

      - name: Create new tag
        run: |
          git tag "${{ github.event.inputs.tag }}"
          git push --tags

      - name: Publish bootstrap zips to GitHub release
        uses: termux/upload-release-action@v5.0.0
        with:
          file: "*.zip"
          file_glob: true
          checksums: sha256
          tag: ${{ github.event.inputs.tag }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}

  apk:
    needs: bootstraps
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Fetch bootstrap archives
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: ./

      - name: Setup java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build apk
        run: |
          git clone https://github.com/jekyllex/termux-app --depth 1
          find . -name 'ruby-*.zip' ! -path './termux-app/*' -exec mv {} termux-app/bootstraps/ \;
          ls termux-app/bootstraps/ruby-*.zip
          cd termux-app
          ./gradlew assembleDebug

      - name: Store generated APK file
        uses: actions/upload-artifact@v7
        with:
          name: termux-app
          path: ./termux-app/app/build/outputs/apk/debug/*.apk
