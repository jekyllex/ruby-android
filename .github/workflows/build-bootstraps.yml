name: Build bootstraps

on:
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        description: "Release built bootstraps"
      tag:
        type: string
        description: "Tag for the release"

# termux-packages @ NDK r29 (16 KB ELF align by default).
# Bump when intentionally rebasing the package tree.
env:
  TERMUX_PACKAGES_REF: "23d530425344010b73b0392ab66b041e8f65e34b"

jobs:
  bootstraps:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target_arch: [aarch64, arm, i686, x86_64]

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h

      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: jekyllex

      - name: Get packages from termux-packages
        uses: actions/checkout@v4
        with:
          path: termux-packages
          repository: termux/termux-packages
          ref: ${{ env.TERMUX_PACKAGES_REF }}

      - name: Overlay JekyllEx scripts and patches
        run: |
          set -euo pipefail
          cp jekyllex/build-bootstraps.sh termux-packages/scripts/
          chmod +x termux-packages/scripts/build-bootstraps.sh jekyllex/apply-jekyllex-identity.sh
          jekyllex/apply-jekyllex-identity.sh termux-packages/scripts/properties.sh

          # Use upstream ncurses/libxml2/git recipes (NDK r29 / current sources).
          # Replace only the ruby package with JekyllEx 3.3.x + app-specific patches.
          rm -rf termux-packages/packages/ruby
          cp -a jekyllex/patches/ruby termux-packages/packages/ruby
          if [ -d jekyllex/patches/gems ]; then
            cp -a jekyllex/patches/gems termux-packages/packages/ruby/gem-patches
          fi

          # libxml2 python bindings pull CPython (+tk/X11) as a build dep.
          # Disable them; nokogiri only needs libxml2/libxslt C libraries.
          if [ -f termux-packages/packages/libxml2/build.sh ]; then
            sed -i \
              -e 's/TERMUX_PKG_SETUP_PYTHON=true/TERMUX_PKG_SETUP_PYTHON=false/' \
              -e 's/-Dpython=enabled/-Dpython=disabled/' \
              -e 's/doxygen, python, readline/readline/' \
              termux-packages/packages/libxml2/build.sh
          fi

          # Optional git password-from-config fix.
          if [ -f jekyllex/patches/git/credential.c.patch ]; then
            cp -a jekyllex/patches/git/credential.c.patch termux-packages/packages/git/ || true
          fi

          find termux-packages/packages/git -type f -name "*subpackage*" -exec rm {} + || true
      - name: Create bootstrap archive (Termux docker builder)
        working-directory: termux-packages
        env:
          CI: "true"
        run: |
          set -euo pipefail
          # package-builder image already has NDK r29 + SDK (baked by Termux Dockerfile).
          # Do not re-run setup-android-sdk.sh: after UID remap it fails with
          # "Failed to read or create install properties file".
          ./scripts/run-docker.sh true
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh \
            --android10 -f --architectures ${{ matrix.target_arch }}

      - name: Verify 16 KB ELF alignment (arm64/x86_64)
        if: matrix.target_arch == 'aarch64' || matrix.target_arch == 'x86_64'
        working-directory: termux-packages
        run: |
          set -euo pipefail
          zip="ruby-${{ matrix.target_arch }}.zip"
          test -f "$zip"
          tmp=$(mktemp -d)
          unzip -q -d "$tmp" "$zip"
          mapfile -t files < <(find "$tmp" -type f -exec file -b {} + | paste -d '|' <(find "$tmp" -type f) - | awk -F'|' '/ELF/ {print $1}' | head -30)
          test "${#files[@]}" -gt 0
          failed=0
          for f in "${files[@]}"; do
            out=$(readelf -lW "$f" 2>/dev/null || llvm-readelf -lW "$f" 2>/dev/null || true)
            [ -n "$out" ] || continue
            echo "== $f =="
            echo "$out" | awk '/LOAD/ {print}'
            if echo "$out" | awk '/LOAD/ {print $NF}' | grep -qE '0x1000$'; then
              echo "FAIL: 4 KB LOAD align in $f"
              failed=1
            fi
          done
          exit "$failed"

      - name: Store bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: ruby-${{ matrix.target_arch }}
          path: termux-packages/ruby-*.zip

  release:
    needs: bootstraps
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event.inputs.release == 'true' && startsWith(github.event.inputs.tag, 'v')
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch bootstrap archives
        uses: actions/download-artifact@v4
        with:
          path: ./
          merge-multiple: true

      - name: Create new tag
        run: |
          git tag "${{ github.event.inputs.tag }}"
          git push --tags

      - name: Publish bootstrap zips to GitHub release
        uses: termux/upload-release-action@v4.1.0
        with:
          file: "*.zip"
          file_glob: true
          checksums: sha256
          tag: ${{ github.event.inputs.tag }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}

  apk:
    needs: bootstraps
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch bootstrap archives
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: ./

      - name: Setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build apk
        run: |
          git clone https://github.com/jekyllex/termux-app --depth 1
          mv *.zip termux-app/bootstraps
          cd termux-app
          ./gradlew assembleDebug

      - name: Store generated APK file
        uses: actions/upload-artifact@v4
        with:
          name: termux-app
          path: ./termux-app/app/build/outputs/apk/debug/*.apk
